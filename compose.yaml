services:
  backend:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: luogo
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - luogo-db:/var/lib/postgresql/data

volumes:
  luogo-db:
