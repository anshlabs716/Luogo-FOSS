name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "relay/**"
  pull_request:
    paths:
      - "relay/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build backend
        run: ./gradlew :relay:build --stacktrace
