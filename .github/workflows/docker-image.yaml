name: Relay image

# Builds and publishes the relay image on tag push.
#
# The image is built from relay/Dockerfile, which compiles the Gradle project so the relay
# shares its authorisation engine with the Android client.

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  build:
    name: Build and push relay image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # relayOnly excludes :app, so this check needs no Android SDK and fails if the server
      # ever grows a dependency on the app module.
      - name: Verify the relay builds
        run: ./gradlew :relay:installDist --no-daemon -PrelayOnly=true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/luogo-relay
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: relay/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
