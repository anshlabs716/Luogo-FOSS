name: Android release

# Builds, signs and publishes the APK on a tag push.
#
# Signing keys come from repository secrets and are never committed. If the signing secrets
# are absent the release job fails loudly rather than publishing an unsigned or
# debug-signed APK.

on:
  push:
    tags:
      - v*
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Unit tests cover location fusion, crypto, the BLE protocol, geofencing, the Room
      # schema and the relay engine. They must pass before anything is shipped.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Lint
        run: ./gradlew :app:lintRelease --no-daemon

      # R8 is enabled with resource shrinking; this proves the release variant still builds
      # and passes lint with shrinking on, before any signing is involved.
      - name: Assemble release unsigned
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Confirm no Google Play Services code is bundled
        # Privacy requirement: the app must not depend on Play Services, so the DEX must not
        # reference its mock-location or vendor endpoints.
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          if [ ! -f "$APK" ]; then
            echo "release APK missing" >&2
            exit 1
          fi
          if unzip -p "$APK" 'classes*.dex' | strings | grep -E 'mt[123]\.google\.com|google\.com/vt'; then
            echo "::error::Play Services references found in the release DEX" >&2
            exit 1
          fi
          echo "No Play Services references in the release DEX"

      - name: Upload unsigned artefacts
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/reports/lint-results-release.html
          retention-days: 14

  release:
    name: Signed release
    needs: verify
    # Only tags produce a published release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fail early if the signing key is missing
        env:
          KEYSTORE_B64: ${{ secrets.LUOGO_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.LUOGO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LUOGO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set. Refusing to publish an unsigned APK." >&2
              exit 1
            fi
          done

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.LUOGO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
          # The key exists only for the duration of this job.
          chmod 600 "$RUNNER_TEMP/keystore.jks"

      - name: Build signed release APK
        env:
          LUOGO_STORE_FILE: ${{ runner.temp }}/keystore.jks
          LUOGO_STORE_PASSWORD: ${{ secrets.LUOGO_KEY_PASSWORD }}
          LUOGO_KEY_ALIAS: ${{ secrets.LUOGO_KEY_ALIAS }}
          LUOGO_KEY_PASSWORD: ${{ secrets.LUOGO_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Locate and verify the signed APK
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -1)"
          if [ -z "$APK" ]; then
            echo "::error::No signed APK was produced" >&2
            exit 1
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          # Pinned versions of build-tools go missing as the runner image moves on.
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools" >&2
            exit 1
          fi

          # A debug-signed release would install everywhere and is not a release. Refuse it.
          if "$APKSIGNER" verify --print-certs "$APK" | grep -q "CN=Android Debug"; then
            echo "::error::APK is debug-signed" >&2
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK"

      - name: Generate SHA-256
        run: |
          set -euo pipefail
          cd "$(dirname "$APK_PATH")"
          sha256sum "$(basename "$APK_PATH")" > "${GITHUB_WORKSPACE}/app.sha256"
          cd "$GITHUB_WORKSPACE"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APK_PATH }}
            app.sha256
          generate_release_notes: true
          body: |
            ## SHA-256

            ```
            $(cat app.sha256)
            ```
