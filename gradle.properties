# Sized for a small machine. The previous -Xmx4G reserved more than the host had available.
#
# Metaspace must stay well above the old 384m: R8 and lint both load enough classes to OOM
# the metaspace at that size. 1G is the floor that completes a release build. The heap is the
# part that can be cut, and 1.5G is enough for R8 with resource shrinking.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# One JVM instead of three. The Kotlin compiler daemon is a separate process, and Gradle forks
# its own, so the default configuration runs the build across multiple multi-hundred-megabyte
# heaps at once. In-process compilation puts the Kotlin compiler in the Gradle daemon.
kotlin.compiler.execution.strategy=in-process

# Build one task at a time on one worker. Parallel execution raises peak memory well past
# what this build needs and the tasks here are mostly sequential anyway.
org.gradle.parallel=false
org.gradle.workers.max=1

# Reuse configuration and build outputs across runs, which cuts repeated build time and the
# CPU needed to get there.
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
